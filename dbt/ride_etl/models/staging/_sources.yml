version: 2

sources:
  - name: raw
    schema: raw
    description: "1:1 copies of ride_prod OLTP tables, landed by Week3/pipeline.py"
    tables:
      - name: drivers
        columns:
          - name: driver_id
            data_tests: [unique, not_null]
          - name: name
            data_tests: [not_null]
          - name: status
            data_tests: [not_null]
          - name: joined_at
            data_tests: [not_null]

      - name: passengers
        columns:
          - name: passenger_id
            data_tests: [unique, not_null]
          - name: name
            data_tests: [not_null]
          - name: status
            data_tests: [not_null]
          - name: created_at
            data_tests: [not_null]

      - name: locations
        columns:
          - name: location_id
            data_tests: [unique, not_null]
          - name: city_name
            data_tests: [not_null]

      - name: payment_methods
        columns:
          - name: payment_method_id
            data_tests: [unique, not_null]
          - name: name
            data_tests: [not_null]
          - name: is_active
            data_tests: [not_null]

      - name: promo_codes
        columns:
          - name: promo_code_id
            data_tests: [unique, not_null]
          - name: code
            data_tests: [not_null]
          - name: discount_type
            data_tests: [not_null]
          - name: discount_value
            data_tests: [not_null]
          - name: is_active
            data_tests: [not_null]

      - name: trips
        columns:
          - name: trip_id
            data_tests: [unique, not_null]
          - name: driver_id
            data_tests: [not_null]
          - name: passenger_id
            data_tests: [not_null]
          - name: pickup_location_id
            data_tests: [not_null]
          - name: dropoff_location_id
            data_tests: [not_null]
          - name: base_fare
            data_tests: [not_null]
          - name: tip_amount
            data_tests: [not_null]
          - name: discount_amount
            data_tests: [not_null]
          - name: surge_multiplier
            data_tests: [not_null]
          - name: distance_km
            data_tests: [not_null]
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['completed', 'cancelled', 'no_show']
          - name: requested_at
            data_tests: [not_null]

      - name: trip_cancellations
        columns:
          - name: trip_id
            data_tests: [unique, not_null]
          - name: cancelled_at
            data_tests: [not_null]
          - name: cancelled_by
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['driver', 'passenger', 'system']

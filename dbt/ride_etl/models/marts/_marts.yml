version: 2

models:
  - name: dim_driver
    columns:
      - name: driver_key
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'suspended']
      - name: joined_at
        data_tests: [not_null]
      - name: tenure_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: ['0-6 months', '6-12 months', '1-2 years', '2+ years']

  - name: dim_passenger
    columns:
      - name: passenger_key
        data_tests: [unique, not_null]
      - name: passenger_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'banned']
      - name: created_at
        data_tests: [not_null]

  - name: dim_location
    columns:
      - name: location_key
        data_tests: [unique, not_null]
      - name: location_id
        data_tests: [unique, not_null]
      - name: city_name
        data_tests: [not_null]
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Northeast', 'Midwest', 'South', 'West', 'International']

  - name: dim_payment_method
    columns:
      - name: payment_method_key
        data_tests: [unique, not_null]
      # name always populated, including the synthetic "Unknown" row
      - name: name
        data_tests: [not_null]
      # payment_method_id / type are null only for the synthetic "Unknown" row
      - name: type
        data_tests:
          - accepted_values:
              arguments:
                values: ['card', 'cash', 'wallet', 'voucher']

  - name: dim_promo_code
    columns:
      - name: promo_code_key
        data_tests: [unique, not_null]
      # code always populated, including the synthetic "No Promo" row
      - name: code
        data_tests: [not_null]
      # promo_code_id / discount_type are null only for the synthetic "No Promo" row
      - name: discount_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['percent', 'flat']

  - name: fact_trips
    columns:
      - name: trip_key
        data_tests: [unique, not_null]
      - name: source_trip_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests: [not_null]
      - name: base_fare
        data_tests: [not_null]
      - name: tip_amount
        data_tests: [not_null]
      - name: discount_amount
        data_tests: [not_null]
      - name: fare_amount
        data_tests: [not_null]
      - name: distance_km
        data_tests: [not_null]
      - name: surge_multiplier
        data_tests: [not_null]
      - name: requested_at
        data_tests: [not_null]
      - name: driver_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_key
      - name: passenger_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_passenger')
                field: passenger_key
      - name: pickup_location_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: dropoff_location_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: payment_method_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_method')
                field: payment_method_key
      - name: promo_code_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_promo_code')
                field: promo_code_key
